name: Deploy to VPS

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www
            cd /var/www
            
            # If the folder doesn't exist, clone it
            if [ ! -d "boardgame.rtsquad.com" ]; then
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git boardgame.rtsquad.com
            fi
            
            cd boardgame.rtsquad.com
            git config --global --add safe.directory /var/www/boardgame.rtsquad.com
            
            # Update remote with current action token to prevent auth errors
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
            
            # Setup Nginx if not already configured
            NGINX_CONF="/etc/nginx/sites-available/boardgame.rtsquad.com"
            if [ ! -f "$NGINX_CONF" ]; then
              echo "Creating Nginx configuration..."
              cat << 'EOF' > $NGINX_CONF
            server {
                listen 80;
                server_name boardgame.rtsquad.com;
                root /var/www/boardgame.rtsquad.com;
                index index.html index.htm index.php UIUX.html;

                location / {
                    try_files $uri $uri/ =404;
                }
            }
            EOF
              ln -sf $NGINX_CONF /etc/nginx/sites-enabled/
              nginx -t && systemctl restart nginx
              echo "Nginx configured and restarted."
            fi
            
            # Add PHP-FPM support if missing
            if ! grep -q "fastcgi_pass" $NGINX_CONF; then
              echo "Adding PHP configuration to Nginx..."
              PHP_SOCK=$(ls /var/run/php/*.sock 2>/dev/null | head -n 1)
              if [ -n "$PHP_SOCK" ]; then
                # Insert the PHP block before the "location / {" block
                sed -i "/location \/ {/i \                location ~ \\\\.php$ {\n                    include snippets/fastcgi-php.conf;\n                    fastcgi_pass unix:$PHP_SOCK;\n                }\n" $NGINX_CONF
                nginx -t && systemctl restart nginx
              fi
            fi
            
            # Setup SSL using Certbot if not already configured
            if ! grep -q "listen 443" $NGINX_CONF; then
              echo "Setting up SSL..."
              if ! command -v certbot &> /dev/null; then
                apt-get update
                apt-get install -y certbot python3-certbot-nginx
              fi
              certbot --nginx --non-interactive --agree-tos -m admin@boardgame.rtsquad.com -d boardgame.rtsquad.com
              echo "SSL configuration completed."
            else
              echo "SSL already configured."
            fi
