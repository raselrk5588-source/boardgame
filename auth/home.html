<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      /* LIGHT BACKGROUND */
      background: linear-gradient(135deg, #f9fafb, #fef2f2);
    }

    /* CARD */
    .card {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: 40px 30px;
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(0, 0, 0, 0.06);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);

      text-align: center;
      color: #111827;
    }

    /* GLOSS EFFECT */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      border-radius: 20px;

      background: linear-gradient(to bottom,
          rgba(255, 255, 255, 0.9),
          transparent);

      opacity: 0.6;
      pointer-events: none;
    }

    /* ICON */
    .icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
      border-radius: 16px;

      background: linear-gradient(135deg, #7a1028, #d61f4b);

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;
      font-size: 24px;
      font-weight: bold;

      box-shadow:
        0 10px 25px rgba(214, 31, 75, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    /* TEXT */
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 22px;
      line-height: 1.6;
    }

    /* STATUS */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 50px;

      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.08);

      font-size: 13px;
      margin-bottom: 26px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    /* BUTTON */
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;

      background: linear-gradient(135deg, #7a1028, #d61f4b);

      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(214, 31, 75, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);

      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow:
        0 12px 25px rgba(214, 31, 75, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    /* FOOTER */
    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <div class="card">



    <div class="title">বিডিঅ্যাপস-এ স্বাগতম</div>

    <div class="subtitle">
      আপনার প্রোফাইল<br>
      যেকোনো সময় আনসাবস্ক্রাইব করতে পারবেন
    </div>

    <div class="status">
      <span class="dot"></span>
      আপনার সাবস্ক্রিপশন চালু আছে
    </div>

    <button onclick="unsubscribe()">আনসাবস্ক্রাইব করুন</button>

    <div class="footer">আপনি যেকোনো সময় আবার সাবস্ক্রাইব করতে পারবেন</div>

  </div>

  <script>
    function unsubscribe() {
      const phone = localStorage.getItem("phone");

      let existingModal = document.getElementById("customConfirmModal");
      if (existingModal) existingModal.remove();

      const modalOverlay = document.createElement("div");
      modalOverlay.id = "customConfirmModal";
      modalOverlay.style.cssText = `
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px);
    z-index: 999999; display: flex; align-items: center; justify-content: center; padding: 20px;
  `;

      const modalBox = document.createElement("div");
      modalBox.style.cssText = `
    background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
    padding: 30px 24px 26px 24px; max-width: 350px; width: 100%;
    text-align: center; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
  `;

      modalBox.innerHTML = `
    <div style="width: 72px; height: 72px; background: rgba(239, 68, 68, 0.15); border: 2px solid #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px auto;">
      <i class="fa-solid fa-user-xmark" style="color: #ef4444; font-size: 32px;"></i>
    </div>
    <h3 style="color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 10px;">সাবস্ক্রিপশন বাতিল</h3>
    <p style="color: #cbd5e1; font-size: 15px; line-height: 1.6; margin-bottom: 26px;">
      আপনি কি নিশ্চিত যে আপনার সাবস্ক্রিপশন বাতিল করতে চান?<br><span style="color: #94a3b8; font-size: 13px;">(বাতিল করলে ল্যান্ডিং পেজে ফিরে যাবে)</span>
    </p>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <button id="modalCancelBtn" style="flex: 1; padding: 13px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer;">না, ফিরে যান</button>
      <button id="modalYesBtn" style="flex: 1; padding: 13px; border-radius: 14px; border: none; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;">হ্যাঁ, বাতিল করুন</button>
    </div>
  `;

      modalOverlay.appendChild(modalBox);
      document.body.appendChild(modalOverlay);

      document.getElementById("modalCancelBtn").addEventListener("click", () => modalOverlay.remove());
      document.getElementById("modalYesBtn").addEventListener("click", async () => {
        modalOverlay.remove();
        try {
          let res = await fetch("https://boardgame.rtsquad.com/auth/unsubscribe.php", {
            method: "POST",
            body: new URLSearchParams({ user_mobile: phone })
          });
          let data = await res.json();
          if (data.success) {
            alert("আপনার সাবস্ক্রিপশন সফলভাবে বাতিল করা হয়েছে।");
          } else {
            alert("আনসাবস্ক্রাইব করতে সমস্যা হচ্ছে: " + (data.error || "অজানা ত্রুটি"));
          }
        } catch (e) {
          alert("নেটওয়ার্ক সমস্যা। আবার চেষ্টা করুন।");
        }
        localStorage.clear();
        window.location.href = "login.html";
      });
    }

    if (!localStorage.getItem("isLoggedIn")) {
      window.location.href = "login.html";
    }
  </script>

</body>

</html>
