<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">আধুনিক ষোল গুটি খেলার বোর্ড</title>
  <desc id="desc">সোনালি চলার রেখাসহ কাঠের বোর্ডে সবুজ ও লাল রঙের ষোলটি করে গুটি</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c21"/>
      <stop offset="0.5" stop-color="#0a3033"/>
      <stop offset="1" stop-color="#041416"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#46d6b6" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#0b7d73" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86b2d"/>
      <stop offset=".18" stop-color="#6d3d18"/>
      <stop offset=".5" stop-color="#3c200f"/>
      <stop offset=".82" stop-color="#7c471c"/>
      <stop offset="1" stop-color="#bd7b34"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e1e11"/>
      <stop offset=".34" stop-color="#6a371c"/>
      <stop offset=".68" stop-color="#4a2514"/>
      <stop offset="1" stop-color="#2d150d"/>
    </linearGradient>
    <radialGradient id="playfield" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#744322"/>
      <stop offset=".58" stop-color="#522a17"/>
      <stop offset="1" stop-color="#35180e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ad"/>
      <stop offset=".28" stop-color="#f7c95e"/>
      <stop offset=".62" stop-color="#c48025"/>
      <stop offset="1" stop-color="#ffe28a"/>
    </linearGradient>
    <radialGradient id="greenPiece" cx="32%" cy="22%" r="78%">
      <stop offset="0" stop-color="#d8fff4"/>
      <stop offset=".18" stop-color="#60e7c4"/>
      <stop offset=".56" stop-color="#09a683"/>
      <stop offset="1" stop-color="#035b4d"/>
    </radialGradient>
    <radialGradient id="redPiece" cx="32%" cy="22%" r="78%">
      <stop offset="0" stop-color="#fff3e1"/>
      <stop offset=".18" stop-color="#ffb16a"/>
      <stop offset=".55" stop-color="#f04f3e"/>
      <stop offset="1" stop-color="#8e1726"/>
    </radialGradient>
    <radialGradient id="node" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#fff5bd"/>
      <stop offset=".45" stop-color="#d99c37"/>
      <stop offset="1" stop-color="#714018"/>
    </radialGradient>
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <filter id="pieceShadow" x="-70%" y="-70%" width="240%" height="260%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#150803" flood-opacity=".75"/>
    </filter>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .23" numOctaves="2" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
    <pattern id="inlay" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 17 H 34" stroke="#f6cf69" stroke-opacity=".08" stroke-width="2"/>
    </pattern>

    <g id="emptyNode">
      <circle r="17" fill="#26140d" opacity=".7"/>
      <circle r="11.5" fill="url(#node)" stroke="#ffe8a0" stroke-width="2"/>
      <circle cx="-3" cy="-3" r="3.5" fill="#fff6c8" opacity=".7"/>
    </g>
    <g id="green">
      <circle cy="3" r="33" fill="#1b0d08" opacity=".65"/>
      <circle r="31" fill="url(#greenPiece)" stroke="#93ffe5" stroke-width="3"/>
      <circle r="24" fill="none" stroke="#b9fff0" stroke-opacity=".25" stroke-width="2"/>
      <ellipse cx="-9" cy="-11" rx="8" ry="5" fill="#fff" opacity=".52" transform="rotate(-28)"/>
    </g>
    <g id="red">
      <circle cy="3" r="33" fill="#1b0d08" opacity=".65"/>
      <circle r="31" fill="url(#redPiece)" stroke="#ffd0a6" stroke-width="3"/>
      <circle r="24" fill="none" stroke="#fff3d6" stroke-opacity=".25" stroke-width="2"/>
      <ellipse cx="-9" cy="-11" rx="8" ry="5" fill="#fff" opacity=".55" transform="rotate(-28)"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#halo)"/>
  <circle cx="105" cy="120" r="2.5" fill="#ffde91" opacity=".45"/>
  <circle cx="1490" cy="160" r="2" fill="#7fffe4" opacity=".42"/>
  <circle cx="1530" cy="820" r="3" fill="#ffcf73" opacity=".28"/>
  <circle cx="85" cy="860" r="2" fill="#7fffe4" opacity=".35"/>

  <g filter="url(#boardShadow)">
    <rect x="62" y="82" width="1476" height="836" rx="86" fill="url(#frame)" stroke="#e6a851" stroke-width="5"/>
    <rect x="80" y="100" width="1440" height="800" rx="72" fill="#291208" stroke="#241007" stroke-width="5"/>
    <rect x="98" y="118" width="1404" height="764" rx="58" fill="url(#wood)" filter="url(#grain)"/>
    <rect x="111" y="131" width="1378" height="738" rx="48" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".75"/>
    <rect x="126" y="146" width="1348" height="708" rx="38" fill="url(#playfield)"/>
    <rect x="126" y="146" width="1348" height="708" rx="38" fill="url(#inlay)" opacity=".7"/>
    <rect x="145" y="165" width="1310" height="670" rx="28" fill="none" stroke="#d69234" stroke-opacity=".35" stroke-width="2"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#4c250f" stroke-width="19" opacity=".85">
        <path d="M420 250H1180 M420 375H1180 M130 500H1470 M420 625H1180 M420 750H1180"/>
        <path d="M420 250V750 M610 250V750 M800 250V750 M990 250V750 M1180 250V750"/>
        <path d="M420 250L800 500 M420 500L800 250 M800 250L1180 500 M800 500L1180 250 M420 500L800 750 M420 750L800 500 M800 500L1180 750 M800 750L1180 500"/>
        <path d="M130 250V750 M275 375V625 M130 250L420 500L130 750"/>
        <path d="M1470 250V750 M1325 375V625 M1470 250L1180 500L1470 750"/>
      </g>
      <g stroke="url(#gold)" stroke-width="7" filter="url(#lineGlow)" opacity=".98">
        <path d="M420 250H1180 M420 375H1180 M130 500H1470 M420 625H1180 M420 750H1180"/>
        <path d="M420 250V750 M610 250V750 M800 250V750 M990 250V750 M1180 250V750"/>
        <path d="M420 250L800 500 M420 500L800 250 M800 250L1180 500 M800 500L1180 250 M420 500L800 750 M420 750L800 500 M800 500L1180 750 M800 750L1180 500"/>
        <path d="M130 250V750 M275 375V625 M130 250L420 500L130 750"/>
        <path d="M1470 250V750 M1325 375V625 M1470 250L1180 500L1470 750"/>
      </g>
    </g>

    <g opacity=".98">
      <use href="#emptyNode" transform="translate(130 250)"/><use href="#emptyNode" transform="translate(130 500)"/><use href="#emptyNode" transform="translate(130 750)"/>
      <use href="#emptyNode" transform="translate(275 375)"/><use href="#emptyNode" transform="translate(275 500)"/><use href="#emptyNode" transform="translate(275 625)"/>
      <use href="#emptyNode" transform="translate(420 250)"/><use href="#emptyNode" transform="translate(420 375)"/><use href="#emptyNode" transform="translate(420 500)"/><use href="#emptyNode" transform="translate(420 625)"/><use href="#emptyNode" transform="translate(420 750)"/>
      <use href="#emptyNode" transform="translate(610 250)"/><use href="#emptyNode" transform="translate(610 375)"/><use href="#emptyNode" transform="translate(610 500)"/><use href="#emptyNode" transform="translate(610 625)"/><use href="#emptyNode" transform="translate(610 750)"/>
      <use href="#emptyNode" transform="translate(800 250)"/><use href="#emptyNode" transform="translate(800 375)"/><use href="#emptyNode" transform="translate(800 500)"/><use href="#emptyNode" transform="translate(800 625)"/><use href="#emptyNode" transform="translate(800 750)"/>
      <use href="#emptyNode" transform="translate(990 250)"/><use href="#emptyNode" transform="translate(990 375)"/><use href="#emptyNode" transform="translate(990 500)"/><use href="#emptyNode" transform="translate(990 625)"/><use href="#emptyNode" transform="translate(990 750)"/>
      <use href="#emptyNode" transform="translate(1180 250)"/><use href="#emptyNode" transform="translate(1180 375)"/><use href="#emptyNode" transform="translate(1180 500)"/><use href="#emptyNode" transform="translate(1180 625)"/><use href="#emptyNode" transform="translate(1180 750)"/>
      <use href="#emptyNode" transform="translate(1325 375)"/><use href="#emptyNode" transform="translate(1325 500)"/><use href="#emptyNode" transform="translate(1325 625)"/>
      <use href="#emptyNode" transform="translate(1470 250)"/><use href="#emptyNode" transform="translate(1470 500)"/><use href="#emptyNode" transform="translate(1470 750)"/>
    </g>

    <g filter="url(#pieceShadow)">
      <use href="#green" transform="translate(130 250)"/><use href="#green" transform="translate(130 500)"/><use href="#green" transform="translate(130 750)"/>
      <use href="#green" transform="translate(275 375)"/><use href="#green" transform="translate(275 500)"/><use href="#green" transform="translate(275 625)"/>
      <use href="#green" transform="translate(420 250)"/><use href="#green" transform="translate(420 375)"/><use href="#green" transform="translate(420 500)"/><use href="#green" transform="translate(420 625)"/><use href="#green" transform="translate(420 750)"/>
      <use href="#green" transform="translate(610 250)"/><use href="#green" transform="translate(610 375)"/><use href="#green" transform="translate(610 500)"/><use href="#green" transform="translate(610 625)"/><use href="#green" transform="translate(610 750)"/>

      <use href="#red" transform="translate(990 250)"/><use href="#red" transform="translate(990 375)"/><use href="#red" transform="translate(990 500)"/><use href="#red" transform="translate(990 625)"/><use href="#red" transform="translate(990 750)"/>
      <use href="#red" transform="translate(1180 250)"/><use href="#red" transform="translate(1180 375)"/><use href="#red" transform="translate(1180 500)"/><use href="#red" transform="translate(1180 625)"/><use href="#red" transform="translate(1180 750)"/>
      <use href="#red" transform="translate(1325 375)"/><use href="#red" transform="translate(1325 500)"/><use href="#red" transform="translate(1325 625)"/>
      <use href="#red" transform="translate(1470 250)"/><use href="#red" transform="translate(1470 500)"/><use href="#red" transform="translate(1470 750)"/>
    </g>
  </g>
</svg>
